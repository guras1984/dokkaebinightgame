# 도깨비 밤 같이 하기 서버 (Cloudflare Workers + Durable Objects, 무료 플랜)
name = "dokkaebi-night"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

