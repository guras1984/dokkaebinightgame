<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0d1430" />
  <title>도깨비 밤</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <div id="view"></div>

    <!-- HUD -->
    <div id="hud" hidden>
      <div class="hud-left">
        <div class="hp">
          <span class="hp-label">체력</span>
          <div class="bar"><i id="hp-fill"></i></div>
        </div>
        <div class="res-row">
          <div class="res" data-kind="wood"><span class="res-icon wood"></span><b id="res-wood">0</b></div>
          <div class="res" data-kind="stone"><span class="res-icon stone"></span><b id="res-stone">0</b></div>
          <div class="res" data-kind="bead"><span class="res-icon bead"></span><b id="res-bead">0</b></div>
        </div>
      </div>
      <div class="hud-center">
        <div class="clock" id="clock">
          <span class="clock-icon" id="clock-icon">☀</span>
          <span class="clock-text" id="clock-text">낮</span>
          <div class="clock-bar"><i id="clock-fill"></i></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="res fire"><span class="res-icon flame"></span><div class="bar small"><i id="fire-fill"></i></div></div>
        <button id="pause-btn" class="icon-btn" aria-label="일시정지">Ⅱ</button>
      </div>
    </div>

    <div id="danger"></div>
    <div id="banner"><small id="banner-sub"></small><b id="banner-text"></b></div>
    <div id="toast" aria-live="polite"></div>
    <div id="popups"></div>

    <!-- Touch controls -->
    <div id="touch" hidden>
      <div id="stick-zone"></div>
      <div id="stick" hidden><div id="stick-knob"></div></div>
      <div id="item-bar"></div>
      <button id="btn-craft" class="pill-btn" hidden>만들기</button>
      <div class="btns">
        <button id="btn-roll" class="round-btn small-btn">구르기</button>
        <button id="btn-action" class="round-btn big-btn"><span id="action-label">베기</span></button>
      </div>
    </div>
    <div id="keys-hint" hidden>WASD 이동 · J 행동 · K 구르기 · 1~4 아이템 · C 만들기 · P 멈춤</div>

    <section id="craft" hidden>
      <div class="craft-head"><b>만들기</b><span class="craft-sub">모닥불 옆에서만</span><button id="craft-close" class="icon-btn" aria-label="닫기">✕</button></div>
      <div id="craft-list"></div>
    </section>

    <!-- Screens -->
    <section id="title-screen" class="screen">
      <div class="panel">
        <small class="eyebrow">한국 설화 생존 모험</small>
        <h1>도깨비 밤</h1>
        <p>곰은 동굴에서 백 일을 버텨 사람이 되었다.<br />너는 도깨비 섬에서 <b>백 일 밤</b>을 버텨라.<br />낮에는 모으고 짓고, 밤에는 불빛을 지켜라.</p>
        <button id="start-btn" class="primary">첫째 날 시작</button>
        <p class="best" id="best"></p>
      </div>
    </section>

    <section id="pause-screen" class="screen" hidden>
      <div class="panel">
        <h2>잠시 멈춤</h2>
        <button id="resume-btn" class="primary">계속하기</button>
        <button id="quit-btn" class="ghost">처음으로</button>
      </div>
    </section>

    <section id="result-screen" class="screen" hidden>
      <div class="panel">
        <small class="eyebrow" id="result-eyebrow">첫째 밤</small>
        <h2 id="result-title">살아남았다</h2>
        <p id="result-desc"></p>
        <ul class="stats" id="result-stats"></ul>
        <button id="again-btn" class="primary">다시 하기</button>
      </div>
    </section>

    <div id="tune" hidden></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
